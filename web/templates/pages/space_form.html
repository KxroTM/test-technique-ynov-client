{{define "content"}}
<nav class="breadcrumb">
    <a href="/spaces">Mes espaces</a>
    <span class="breadcrumb-sep" aria-hidden="true">/</span>
    <span>{{.Title}}</span>
</nav>

<div class="page-header">
    <div>
        <h1 class="page-title">{{.Title}}</h1>
        <p class="page-subtitle">Un espace regroupe des notes autour d'un même thème.</p>
    </div>
</div>

<section class="card form-card">
    <form method="post" action="{{.FormAction}}" class="form">
        <div class="field">
            <label for="name">Nom de l'espace</label>
            <input type="text" id="name" name="name" value="{{.Form.Name}}"
                   placeholder="Devoirs" maxlength="100" required autofocus>
            <span class="hint">Par exemple : Devoirs, Jobs, Personnel.</span>
            {{template "fieldError" (index .FieldErrors "name")}}
        </div>

        <div class="field">
            <label for="description">Description <span class="hint">(facultative)</span></label>
            <textarea id="description" name="description" rows="4" maxlength="1000"
                      placeholder="Travaux scolaires et rendus à préparer">{{.Form.Description}}</textarea>
            {{template "fieldError" (index .FieldErrors "description")}}
        </div>

        <div class="form-actions">
            <button type="submit" class="button button-primary">{{.SubmitLabel}}</button>
            <a class="button button-ghost" href="{{.CancelURL}}">Annuler</a>
        </div>
    </form>
</section>
{{end}}
