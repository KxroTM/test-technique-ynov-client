{{define "noteCard"}}
<article class="note" data-note-id="{{.ID}}" data-status="{{.Status}}" draggable="true">
    <h3 class="note-title"><a href="/notes/{{.ID}}/edit">{{.Title}}</a></h3>

    {{with .Content}}
    <p class="note-excerpt">{{truncate . 140}}</p>
    {{end}}

    <div class="note-foot">
        <span class="note-date">{{relativeAge .UpdatedAt}}</span>

        <div class="note-actions">
            <form class="move-form" method="post" action="/notes/{{.ID}}/status">
                <button type="submit" name="status" value="{{.Status.Prev}}" class="icon-button"
                        data-direction="prev" title="Déplacer vers « {{.Status.Prev.Label}} »"
                        {{if eq .Status "todo"}}hidden{{end}}>
                    {{template "iconLeft"}}
                    <span class="visually-hidden">Déplacer « {{.Title}} » vers {{.Status.Prev.Label}}</span>
                </button>

                <button type="submit" name="status" value="{{.Status.Next}}" class="icon-button"
                        data-direction="next" title="Déplacer vers « {{.Status.Next.Label}} »"
                        {{if eq .Status "done"}}hidden{{end}}>
                    {{template "iconRight"}}
                    <span class="visually-hidden">Déplacer « {{.Title}} » vers {{.Status.Next.Label}}</span>
                </button>
            </form>

            <a class="icon-button" href="/notes/{{.ID}}/edit" title="Modifier">
                {{template "iconPencil"}}
                <span class="visually-hidden">Modifier « {{.Title}} »</span>
            </a>

            <form method="post" action="/notes/{{.ID}}/delete"
                  data-confirm="Supprimer « {{.Title}} » ?"
                  data-confirm-detail="Cette note sera définitivement supprimée.">
                <button type="submit" class="icon-button danger" title="Supprimer">
                    {{template "iconTrash"}}
                    <span class="visually-hidden">Supprimer « {{.Title}} »</span>
                </button>
            </form>
        </div>
    </div>
</article>
{{end}}
